name: Publish to BCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released vMAJOR.MINOR.PATCH tag to propose to BCR"
        required: true
        type: string

permissions: {}

jobs:
  publish:
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0
    with:
      attest: true
      registry_fork: realityforge/bazel-central-registry
      tag_name: ${{ inputs.tag }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
