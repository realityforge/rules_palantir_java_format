name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Bazel ${{ matrix.bazel }} / Java ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bazel: 8.4.2
            java: 17
          - os: ubuntu-latest
            bazel: 9.2.0
            java: 17
          - os: macos-15-intel
            bazel: 8.4.2
            java: 17
          - os: macos-15-intel
            bazel: 9.2.0
            java: 17
          - os: macos-15
            bazel: 8.4.2
            java: 17
          - os: macos-15
            bazel: 9.2.0
            java: 17
          - os: windows-latest
            bazel: 8.4.2
            java: 17
          - os: windows-latest
            bazel: 9.2.0
            java: 17
          - os: ubuntu-latest
            bazel: 9.2.0
            java: 21
          - os: ubuntu-latest
            bazel: 9.2.0
            java: 25
    env:
      RULES_PJF_USE_LOCAL_JDK: "1"
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: bazel-contrib/setup-bazel@v0.19.0
        with:
          disk-cache: true
          repository-cache: true
      - shell: bash
        run: tools/check.sh
