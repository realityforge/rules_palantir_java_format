name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Java 17 / Bazel 8.4.2 / Ubuntu x86_64
            os: ubuntu-latest
            bazel: 8.4.2
            java: 17
          - name: Java 17 / Bazel 9.3.0 / Ubuntu x86_64
            os: ubuntu-latest
            bazel: 9.3.0
            java: 17
          - name: Java 17 / Bazel 8.4.2 / macOS x86_64
            os: macos-15-intel
            bazel: 8.4.2
            java: 17
          - name: Java 17 / Bazel 9.3.0 / macOS x86_64
            os: macos-15-intel
            bazel: 9.3.0
            java: 17
          - name: Java 17 / Bazel 8.4.2 / macOS arm64
            os: macos-15
            bazel: 8.4.2
            java: 17
          - name: Java 17 / Bazel 9.3.0 / macOS arm64
            os: macos-15
            bazel: 9.3.0
            java: 17
          - name: Java 17 / Bazel 8.4.2 / Windows x86_64
            os: windows-latest
            bazel: 8.4.2
            java: 17
          - name: Java 17 / Bazel 9.3.0 / Windows x86_64
            os: windows-latest
            bazel: 9.3.0
            java: 17
          - name: Java 21 / Bazel 9.3.0 / Ubuntu x86_64
            os: ubuntu-latest
            bazel: 9.3.0
            java: 21
          - name: Java 25 / Bazel 9.3.0 / Ubuntu x86_64
            os: ubuntu-latest
            bazel: 9.3.0
            java: 25
    env:
      RULES_PJF_USE_LOCAL_JDK: "1"
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Bazelisk
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset="bazelisk-linux-amd64"; sha256="5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992" ;;
            Linux-ARM64) asset="bazelisk-linux-arm64"; sha256="e20e8b0f4f240091b7a55bf17b9398bd4f40ee70ae0208dff95dd4c445fb4010" ;;
            macOS-X64) asset="bazelisk-darwin-amd64"; sha256="16c3d7aa15323a9fb69f56c7ec5733ed18bedb786680d0ba13bb12a3c8083007" ;;
            macOS-ARM64) asset="bazelisk-darwin-arm64"; sha256="cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409" ;;
            Windows-X64) asset="bazelisk-windows-amd64.exe"; sha256="092a8738d5b41aae7a85c42cc961b1034e3389aba43ffc20c0fabda7b43e095b" ;;
            *) echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          bazelisk_dir="${RUNNER_TEMP//\\//}/bazelisk"
          mkdir -p "${bazelisk_dir}"
          executable=bazel
          if [[ "${RUNNER_OS}" == Windows ]]; then executable=bazel.exe; fi
          curl -fsSL "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/${asset}" -o "${bazelisk_dir}/${executable}"
          if [[ "${RUNNER_OS}" == macOS ]]; then
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | shasum -a 256 -c -
          else
            printf '%s  %s\n' "${sha256}" "${bazelisk_dir}/${executable}" | sha256sum -c -
          fi
          chmod +x "${bazelisk_dir}/${executable}"
          echo "${bazelisk_dir}" >> "${GITHUB_PATH}"
      - shell: bash
        run: tools/check.sh
