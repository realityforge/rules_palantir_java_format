name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Java 17 / Bazel 8.4.2 / Ubuntu x86_64
            os: ubuntu-latest
            bazel: 8.4.2
            java: 17
          - name: Java 17 / Bazel 9.2.0 / Ubuntu x86_64
            os: ubuntu-latest
            bazel: 9.2.0
            java: 17
          - name: Java 17 / Bazel 8.4.2 / macOS x86_64
            os: macos-15-intel
            bazel: 8.4.2
            java: 17
          - name: Java 17 / Bazel 9.2.0 / macOS x86_64
            os: macos-15-intel
            bazel: 9.2.0
            java: 17
          - name: Java 17 / Bazel 8.4.2 / macOS arm64
            os: macos-15
            bazel: 8.4.2
            java: 17
          - name: Java 17 / Bazel 9.2.0 / macOS arm64
            os: macos-15
            bazel: 9.2.0
            java: 17
          - name: Java 17 / Bazel 8.4.2 / Windows x86_64
            os: windows-latest
            bazel: 8.4.2
            java: 17
          - name: Java 17 / Bazel 9.2.0 / Windows x86_64
            os: windows-latest
            bazel: 9.2.0
            java: 17
          - name: Java 21 / Bazel 9.2.0 / Ubuntu x86_64
            os: ubuntu-latest
            bazel: 9.2.0
            java: 21
          - name: Java 25 / Bazel 9.2.0 / Ubuntu x86_64
            os: ubuntu-latest
            bazel: 9.2.0
            java: 25
    env:
      RULES_PJF_USE_LOCAL_JDK: "1"
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425
        with:
          disk-cache: true
          repository-cache: true
      - shell: bash
        run: tools/check.sh
